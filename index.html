<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapStoneFlow | Precision Academic Workflow & Progress Intelligence OS</title>
    <meta name="description" content="Precision workflow execution, academic milestone gates, and progress intelligence for capstone teams." />
    
    <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Zero-Flicker Instant Theme Script (Pre-paint Execution) -->
    <script>
      (function() {
        try {
          var d = document.documentElement;
          var saved = localStorage.getItem('capstoneflow_state_v10_theme') || 
                      localStorage.getItem('capstoneflow_theme') || 
                      localStorage.getItem('capstone_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
          d.classList.remove('light', 'dark');
          d.classList.add(theme);
          d.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
